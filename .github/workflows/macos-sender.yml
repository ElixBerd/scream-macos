name: macOS sender

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['Senders/macos/**', '.github/workflows/macos-sender.yml']
  pull_request:
    paths: ['Senders/macos/**', '.github/workflows/macos-sender.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.2.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: Senders/macos
        run: make all pkg VERSION=${{ steps.version.outputs.version }} CFLAGS="-O2 -Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Check bundles
        working-directory: Senders/macos
        run: |
          plutil -lint build/ScreamAudio.driver/Contents/Info.plist build/Scream.app/Contents/Info.plist
          lipo -info build/ScreamAudio.driver/Contents/MacOS/ScreamAudio build/Scream.app/Contents/MacOS/Scream
          nm -gU build/ScreamAudio.driver/Contents/MacOS/ScreamAudio | grep ScreamAudio_Create
          codesign --verify --verbose build/ScreamAudio.driver build/Scream.app
          pkgutil --payload-files build/Scream-*.pkg
          build/scream-sender -h
      - name: Install the pkg like a user would
        working-directory: Senders/macos
        run: |
          sudo installer -pkg build/Scream-*.pkg -target /
          sleep 5
          ls /Applications/Scream.app/Contents/Resources
          system_profiler SPAudioDataType | grep -A6 "Scream Audio"
          pgrep -x Scream || (open /Applications/Scream.app && sleep 3 && pgrep -x Scream)
          screamctl
      - name: App switched the output on first run
        run: |
          sleep 2
          system_profiler SPAudioDataType | grep -A8 "Scream Audio:" | grep "Default Output Device: Yes"
      - name: Stream a sound to localhost
        working-directory: Senders/macos
        run: |
          screamctl -u 127.0.0.1 -p 4010 -s 288 -b 16 -d
          python3 tests/listen.py 4010 8 &
          sleep 1
          for i in 1 2 3; do afplay /System/Library/Sounds/Glass.aiff; done
          wait $!
      - name: Uninstall
        run: |
          sudo /Applications/Scream.app/Contents/Resources/uninstall.sh
          test ! -e /Applications/Scream.app
          test ! -e /Library/Audio/Plug-Ins/HAL/ScreamAudio.driver
      - uses: actions/upload-artifact@v4
        with:
          name: Scream-${{ steps.version.outputs.version }}
          path: Senders/macos/build/Scream-*.pkg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Senders/macos/build/Scream-*.pkg --title "Scream for macOS $GITHUB_REF_NAME" --generate-notes

permissions:
  contents: write
